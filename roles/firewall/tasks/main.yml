---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Set incoming firewall policy
  community.general.ufw:
    direction: incoming
    policy: "{{ ufw_default_incoming_policy }}"

- name: Set outgoing firewall policy
  community.general.ufw:
    direction: outgoing
    policy: "{{ ufw_default_outgoing_policy }}"

- name: Allow required TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_allowed_tcp_ports }}"
  when: not (ufw_rate_limit_ssh | bool and item | int == (ssh_port | default(22) | int))

- name: Rate-limit SSH connections
  community.general.ufw:
    rule: limit
    port: "{{ ssh_port | default(22) }}"
    proto: tcp
  when: ufw_rate_limit_ssh | bool

- name: Allow required UDP ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: udp
  loop: "{{ ufw_allowed_udp_ports }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled
