---
- name: Install logrotate
  ansible.builtin.apt:
    name: logrotate
    state: present

- name: Create application log directory
  ansible.builtin.file:
    path: /var/log/apps
    state: directory
    owner: root
    group: adm
    mode: "0750"

- name: Configure application log rotation
  ansible.builtin.template:
    src: applications.j2
    dest: /etc/logrotate.d/managed-applications
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/logrotate --debug %s
