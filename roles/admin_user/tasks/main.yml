---
- name: Validate administrator configuration
  ansible.builtin.assert:
    that:
      - admin_user_name | length > 0
      - admin_user_name != 'root'
      - admin_authorized_keys | length > 0
    fail_msg: "Set a non-root admin_user_name and at least one admin_authorized_keys entry."

- name: Ensure requested administrator groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ admin_user_groups }}"

- name: Create administrator account
  ansible.builtin.user:
    name: "{{ admin_user_name }}"
    shell: "{{ admin_user_shell }}"
    groups: "{{ admin_user_groups | join(',') }}"
    append: true
    create_home: true
    password_lock: "{{ admin_user_password_lock }}"
    state: present

- name: Install administrator SSH keys
  ansible.posix.authorized_key:
    user: "{{ admin_user_name }}"
    key: "{{ item }}"
    state: present
    exclusive: false
    manage_dir: true
  loop: "{{ admin_authorized_keys }}"
  no_log: true

- name: Configure scoped sudo access
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ admin_user_name }}"
    content: >-
      {{ admin_user_name }} ALL=(ALL:ALL) {{ 'NOPASSWD:' if admin_sudo_passwordless else '' }} ALL
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
