---
extends: default
ignore: |
  .cache/
  .molecule/
  .venv/
rules:
  empty-lines:
    max-end: 1
  line-length:
    max: 140
    level: warning
  truthy:
    allowed-values: ["true", "false"]
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
